<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pi · Chat</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='20' font-size='20'%3Eπ%3C/text%3E%3C/svg%3E">
</head>
<body data-cwd="">
  <div class="app sidebar-open">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-top">
        <button class="btn-new" id="btnNew" title="新对话">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          <span>新对话</span>
        </button>
      </div>
      <div class="sidebar-search">
        <input id="sidebarSearch" type="text" placeholder="搜索会话…">
      </div>
      <div class="session-list" id="sessionList"></div>
      <div class="sidebar-bottom">
        <div id="connStatus" class="conn-status" title="点击可重新连接"><span id="connDot" style="color: var(--danger);">●</span>&nbsp;<span id="connLabel">连接中…</span></div>
        <div class="sidebar-bottom-meta">
          <div class="sidebar-bottom-links">
            <a href="https://pi.dev" target="_blank" rel="noopener">pi.dev</a>
            <span class="sidebar-link-sep">·</span>
            <a href="https://github.com/liguoshuai-1990/pi-web-chat" target="_blank" rel="noopener">pi-web-chat</a>
          </div>
          <span id="appVersion" class="app-version" title="pi-web-chat 版本"></span>
        </div>
      </div>
      <div class="sidebar-resizer" id="sidebarResizer" title="拖拽调整侧边栏宽度，双击恢复默认"></div>
    </aside>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Main -->
    <main class="main">
      <div class="topbar">
        <button class="btn-toggle-sidebar" id="btnToggleSidebar" title="切换侧边栏">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="session-name" id="topSessionName">新对话</div>
        <button class="btn-ghost" id="cwdPillWrap" title="点击切换工作目录">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px; vertical-align:-2px;"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span id="cwdPill">~</span>
        </button>
        <div class="model-pill-container" id="modelPillContainer">
          <button class="model-pill" id="modelPill" title="点击切换模型 (快捷键: Ctrl+M)">
            <span class="model-pill-name" id="modelPillName">选择模型</span>
            <span class="model-pill-badge" id="modelPillBadge" style="display:none;">★ 默认</span>
          </button>
          <button class="thinking-pill" id="thinkingPill" style="display:none;" title="点击调整深度思考 / 推理级别">
            <span class="thinking-icon">🧠</span>
            <span class="thinking-label" id="thinkingPillLabel">High</span>
          </button>
        </div>
        <button class="btn-topbar-action" id="btnExportChat" title="导出当前对话为 Markdown">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span class="topbar-action-label">导出</span>
        </button>
        <div class="model-menu" id="modelMenu"></div>
        <div class="thinking-menu" id="thinkingMenu"></div>
      </div>

      <div class="chat" id="chat">
        <div id="emptyState" class="empty-state" style="display:flex;">
          <div class="logo">π</div>
          <h1>有什么可以帮你？</h1>
          <p>我是 <strong>pi</strong> 编程助手，可以读写文件、运行命令、改代码。在下方输入你的需求开始，或打开历史会话继续。</p>
          <div class="empty-model-banner" id="emptyModelBanner">
            <div class="empty-model-left">
              <span class="empty-model-icon">🤖</span>
              <div class="empty-model-info">
                <div class="empty-model-title-row">
                  <span class="empty-model-label">当前模型：</span>
                  <span class="empty-model-name" id="emptyModelName">加载中…</span>
                  <span class="badge-default" id="emptyModelBadge" style="display:none;">★ 默认模型</span>
                </div>
                <div class="empty-model-features" id="emptyModelFeatures"></div>
              </div>
            </div>
            <button class="btn-change-model" id="emptyChangeModelBtn">切换模型</button>
          </div>
          <div class="suggestions">
            <div class="chip" data-prompt="列出当前目录下的所有文件，并告诉我这是什么项目">列出当前目录文件</div>
            <div class="chip" data-prompt="阅读 README 或主要源文件，然后用一段话总结这个项目是做什么的">总结这个项目</div>
            <div class="chip" data-prompt="帮我看看当前目录有没有什么可以改进的地方">代码审查</div>
          </div>
        </div>
        <div class="chat-inner" id="chat-inner"></div>
      </div>

      <div class="composer">
        <div class="image-preview-bar" id="imagePreviewBar" style="display:none;"></div>
        <div class="composer-inner" id="composerInner">
          <input type="file" id="imageFileInput" accept="image/*,.png,.jpg,.jpeg,.webp,.gif,.bmp,.svg" multiple style="display:none;">
          <button class="attach-btn" id="btnAttachImage" type="button" title="添加附件 / 图片 (支持拖拽与截图粘贴)">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
            </svg>
          </button>
          <textarea id="composer" rows="1" placeholder="给 pi 发消息…"></textarea>
          <button class="steer-btn" id="steerBtn" title="在 AI 运行过程中插入指导指令" style="display:none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
            <span>插入指令</span>
          </button>
          <button class="send-btn" id="sendBtn" title="发送">↑</button>
        </div>
        <div class="composer-hint">pi 会执行命令与读写你的文件 —— 请注意操作内容。</div>
      </div>
    </main>
  </div>

  <!-- CWD Modal -->
  <div class="modal-overlay" id="cwdModal">
    <div class="modal">
      <div class="modal-header">
        <h3>切换工作目录</h3>
        <button class="btn-close" id="cwdModalClose">&times;</button>
      </div>
      <div class="modal-body">
        <p class="modal-desc">选择或输入 pi 代理运行的目标工作目录：</p>
        <div class="input-group">
          <input type="text" id="cwdInput" placeholder="/path/to/project" />
          <button class="btn-primary" id="cwdConfirmBtn">确定切换</button>
        </div>
        <div id="cwdError" class="modal-error"></div>
        <div class="quick-dirs">
          <span class="quick-label">快捷选择：</span>
          <div id="quickDirChips" class="chips"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile toolbar reveal / scroll-to-top FAB -->
  <button class="mobile-toolbar-fab" id="mobileToolbarFab" title="回到顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <!-- Image Lightbox Modal -->
  <div class="image-lightbox" id="imageLightbox" style="display:none;">
    <button class="lightbox-close" id="lightboxClose" title="关闭大图">&times;</button>
    <img id="lightboxImg" src="" alt="大图预览">
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
