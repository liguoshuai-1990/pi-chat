name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish NPM packages to registry'
        required: false
        type: boolean
        default: false
      npm_otp:
        description: 'NPM 2FA OTP code (if using a Standard Token instead of Automation Token)'
        required: false
        type: string
        default: ''

jobs:
  build-and-test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and syntax check
        run: pnpm build

      - name: Run unit test suite
        run: pnpm test

  npm-deliverables:
    name: Package NPM Deliverables
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package all NPM tarballs
        run: |
          mkdir -p dist/npm
          pnpm pack:all
          find packages server clients/web -maxdepth 2 -name "*.tgz" -exec cp {} dist/npm/ \;
          ls -la dist/npm/

      - name: Upload NPM Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-chat-npm-packages
          path: dist/npm/*.tgz
          retention-days: 30

  harmony-deliverables:
    name: Package HarmonyOS Deliverable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Archive HarmonyOS App Package
        run: |
          mkdir -p dist/harmony
          cd clients/harmony
          zip -r ../../dist/harmony/pi-chat-harmony-app.zip . -x "*.git*" -x "*node_modules*"
          cd ../..
          ls -la dist/harmony/

      - name: Upload HarmonyOS Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-chat-harmony-bundle
          path: dist/harmony/pi-chat-harmony-app.zip
          retention-days: 30

  android-build:
    name: Android Build & Package APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android Debug APK
        working-directory: clients/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi-chat-android-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

  publish-npm:
    name: Publish to NPM Registry
    needs: [build-and-test, npm-deliverables]
    if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_npm == 'true' || github.event.inputs.publish_npm == true) && success()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js for NPM Publishing
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish NPM Packages
        run: |
          if [ -n "${{ github.event.inputs.npm_otp }}" ]; then
            pnpm -r publish --access public --no-git-checks --otp="${{ github.event.inputs.npm_otp }}"
          else
            pnpm -r publish --access public --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-release:
    name: Publish Full Release (All Deliverables)
    needs: [build-and-test, npm-deliverables, harmony-deliverables, android-build, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v') && success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: List downloaded artifacts
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      - name: Create GitHub Release with All Deliverables
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
